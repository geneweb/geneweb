version: 2
updates:
  - package-ecosystem: "docker"
    directory: "docker/"
    schedule:
      interval: "daily"
  - package-ecosystem: "gitsubmodule"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: ".github/workflows/"
    schedule:
      interval: "daily"
